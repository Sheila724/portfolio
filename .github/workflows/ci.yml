name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verificar páginas geradas
        run: |
          test -f out/pt/index.html
          test -f out/en/index.html
          test -f out/manifest.webmanifest
          grep -q 'lang="pt-BR"' out/pt/index.html
          grep -q 'lang="en"' out/en/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Procurar segredos no histórico inteiro
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/repo --redact --verbose

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t portfolio .
      - run: |
          docker run -d --name portfolio-test -p 8080:80 portfolio
          sleep 2
          curl -fsS http://localhost:8080/pt/ | grep -q "Sheila"
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8080/nao-existe/ | grep -q 404
